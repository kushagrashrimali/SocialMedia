  tone: warm, plain-spoken, founder-to-owner; Indian English; short sentences
product:
  name: WYSTAK
  description: 'Digital loyalty cards for cafés and restaurants that live in the customer''s Apple Wallet
    or Google Wallet. The customer scans a QR at the counter (or taps NFC) and the pass is in their wallet:
    no app to download. Staff scan the pass on any phone, tablet or laptop camera; points or stamps update
    within seconds and show on the lock screen. The owner sees who came back, who is close to a reward
    and who stopped coming.'
  pricing: Shared on a call. No credit card required to try it. Do not quote a price in email.
  key_benefits:
  - 'No app for customers: one QR scan (or NFC tap) and the pass is in Apple Wallet or Google Wallet'
  - Points update on the lock screen within seconds of a scan, so the café stays on the customer's phone
    after they pay by UPI
  - Any phone, tablet or laptop camera is the scanner; no POS integration, no extra hardware, manual code
    entry as a backup
  - The card carries the café's own logo, colours and reward
  - 'A simple dashboard: who came back, who is one stamp from a reward, and lapsed regulars worth reaching
    out to'
  objection_responses:
    we already use WhatsApp broadcasts: Those work until they get muted. A wallet pass sits next to their
      cards and updates on the lock screen after every visit, so it is seen without anyone opening a chat.
    my customers won't download an app: They don't have to. It's one scan at the counter and the card
      is in Apple Wallet or Google Wallet.
    we don't have time at the counter: Staff point any phone at the pass and it's done. If a scan fails
      they type the code. No POS changes.
    too expensive: Happy to walk you through what it costs for one outlet, and you can try it before paying
      anything.
    not interested: No worries. Mind if I ask how you keep regulars coming back today?
  offer:
    primary: Monthly plan per outlet
    entry: A free walkthrough showing the pass with your own branding and reward, then a no-credit-card
      trial
    goal: book_call
    booking_method: ask_preference
    booking_url: ''
    meeting_duration: 15 minutes
    meeting_owner: A WYSTAK founder, in person in Udaipur
